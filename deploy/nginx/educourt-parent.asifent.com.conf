# Nginx site config for educourt-parent.asifent.com
#
# Dedicated family (parent + student) app served by the pm2 process
# "educourt-parent" on 127.0.0.1:3002. Apply on the VPS with:
#   scp deploy/nginx/educourt-parent.asifent.com.conf \
#     root@<host>:/etc/nginx/sites-available/educourt-parent.asifent.com
#   nginx -t && systemctl reload nginx
#
# TLS: issued with acme.sh (pure shell, no Python) because the distro certbot
# was broken against Python 3.14. Cert is installed to
# /etc/letsencrypt/live/educourt-parent.asifent.com/ and renews via the
# acme.sh cron with a "systemctl reload nginx" deploy hook.

server {
    listen 80;
    listen [::]:80;
    server_name educourt-parent.asifent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name educourt-parent.asifent.com;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    ssl_certificate /etc/letsencrypt/live/educourt-parent.asifent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educourt-parent.asifent.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
